# MathCraft — standalone knowledge-base + model-configuration backend.
#
# Extracted from DeepTutor @ a31d8262. This project is a snapshot: it does not
# track upstream. Optional RAG engines and parsing engines keep the upstream
# split between the default (LlamaIndex) line and opt-in extras.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MathCraft"
version = "0.1.0"
description = "Knowledge-base and model-configuration backend extracted from DeepTutor"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    # Core runtime
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
    "openai>=1.30.0",
    "tiktoken>=0.5.0",
    "aiohttp>=3.9.4",
    "httpx>=0.27.0",
    "requests>=2.32.2",
    "nest_asyncio>=1.5.8",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "packaging>=24.2",
    "jsonschema>=4.20.0,<5.0.0",
    "aiosqlite>=0.19.0",
    "pageindex>=0.2.10,<0.3.0",
    "tzdata>=2024.1",
    # LLM provider SDKs
    "anthropic>=0.30.0",
    "dashscope>=1.14.0",
    "perplexityai>=0.1.0",
    "oauth-cli-kit>=0.1.1",
    # Default RAG engine (LlamaIndex line)
    "llama-index>=0.14.12",
    "bm25s>=0.3.14,<0.4.0",
    "llama-index-retrievers-bm25>=0.7.1,<0.8.0; python_version < '3.14'",
    "llama-index-vector-stores-faiss>=0.4.0,<1.0.0",
    "faiss-cpu>=1.8.0,<2.0.0; python_version < '3.14'",
    "faiss-cpu>=1.12.0,<2.0.0; python_version >= '3.14'",
    # Document handling
    "PyMuPDF>=1.26.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0,<3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "defusedxml>=0.7.1",
    # HTTP service
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "loguru>=0.7.3,<1.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "psutil>=5.9.0,<8.0.0",
]

[project.optional-dependencies]
# CodeBuddy login / agent SDK (~130 MB headless CLI). Chat works over plain HTTP
# without it, so it stays opt-in as upstream.
codebuddy = ["codebuddy-agent-sdk>=0.3,<0.4"]

# Optional document-parsing engines. Engines import lazily; an absent engine
# reports unavailable in the parsing settings instead of failing.
parse-markitdown = ["markitdown[all]>=0.1.7"]
parse-docling = [
    "docling[xbrl]>=2.123.1",
    "docling-slim[format-iwork,format-opendocument,format-video]>=2.123.1",
]
parse-pymupdf4llm = ["pymupdf4llm>=1.28.2"]
parse-liteparse = ["liteparse>=2.14.2"]
parse = [
    "MathCraft[parse-markitdown]",
    "MathCraft[parse-docling]",
    "MathCraft[parse-pymupdf4llm]",
    "MathCraft[parse-liteparse]",
]

# Optional RAG engines. Heavy and/or externally hosted; the default install
# only covers the LlamaIndex line.
graphrag = ["graphrag>=3.0.1,<4.0.0; python_version < '3.14'"]
rag-lightrag = ["lightrag-hku==1.5.7"]
rag-rerank = ["sentence-transformers>=3.0.0,<6.0.0; python_version < '3.14'"]

engines = [
    "MathCraft[graphrag]",
    "MathCraft[rag-lightrag]",
    "MathCraft[rag-rerank]",
]

# 出题服务（backend/ 下的独立进程）的向量检索依赖。
# 嵌入模型由本地 Ollama 提供，向量库使用 Chroma 单机模式。
question = [
    "langchain-ollama>=0.2.2",
    "chromadb>=0.5.20",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "import-linter>=2.1.0,<3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "defusedxml>=0.7.1",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["math_q_agent*", "api*", "services*", "schemas*"]

[tool.setuptools.package-data]
math_q_agent = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.md",
    "**/*.json",
    "**/*.sh",
    "**/*.j2",
    "**/*.jinja",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
