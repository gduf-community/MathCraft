name: mathcraft-ops-g0-20261112
services:
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0@sha256:b5bcec3455bd5c431f52737fc62046c081752b483e3fff40c63f40783736bcad
    container_name: mathcraft-ops-g0-phoenix-20261112
    env_file:
      - ../../.scratch/ops-g0-20261112/phoenix.env
    ports:
      - "127.0.0.1:6016:6006"
    volumes:
      - type: bind
        source: ${OPS_G0_HOME:?Prepare the isolated G0 environment first}/phoenix-data
        target: /mnt/data
    networks:
      - isolated
    cpus: 2
    mem_limit: 2g
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  isolated:
    driver: bridge
