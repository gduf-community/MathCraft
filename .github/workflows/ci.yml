name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github
          src: backend

  quality:
    name: Pyright, ESLint and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create Python environment
        run: uv venv .venv --python 3.14

      - name: Install Python package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Pyright
        run: frontend/node_modules/.bin/pyright

      - name: Run TypeScript
        run: npm run typecheck
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Verify package identity
        run: >-
          python -c "from importlib.metadata import distribution; import MathCraft;
          assert distribution('MathCraft').metadata['Name'] == 'MathCraft'"

      - name: Run tests
        run: python -m pytest -q
