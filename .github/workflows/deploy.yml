name: Deploy to GitHub Pages

# 手动发布固定提交，构建前和部署前均校验该分支提交的 CI 与 CodeQL。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI and CodeQL
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./.github/scripts/verify-release.cjs');
            await verify({github, context, core});

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Recheck CI before deployment
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./.github/scripts/verify-release.cjs');
            await verify({github, context, core});
      - id: deployment
        uses: actions/deploy-pages@v4
